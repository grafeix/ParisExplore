<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer le Grand Paris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Parti pris : la carte aquarelle occupe tout l'écran et porte la couleur. L'interface flotte dessus,
   en feuilles claires et discrètes : une barre de recherche, des filtres, une navigation en pastille. */
:root{
  --ink:#172A4A; --muted:#5B6B82; --paper:rgba(255,255,255,.92); --solid:#FFFFFF; --bg:#EEF2F6; --line:#DCE3EB;
  --accent:#F5B700; --accent-ink:#3B2C00; --land:#E9EEF3;
  --t-urb:#5568C2; --t-arc:#8757B4; --t-pat:#8C6646; --t-cul:#C13C76; --t-nat:#2F8049; --t-cur:#B07C0C; --t-bie:#1A8597; --t-loi:#D2552B;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 10px 30px rgba(23,42,74,.16),0 2px 6px rgba(23,42,74,.08);
  --soft:0 2px 10px rgba(23,42,74,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#EEF2F8; --muted:#9FB0C8; --paper:rgba(20,28,46,.9); --solid:#141C2E; --bg:#0D1422; --line:#2A3650;
    --accent:#FFC933; --accent-ink:#2B2000; --land:#101828;
    --shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3); --soft:0 2px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#EEF2F8; --muted:#9FB0C8; --paper:rgba(20,28,46,.9); --solid:#141C2E; --bg:#0D1422; --line:#2A3650;
  --accent:#FFC933; --accent-ink:#2B2000; --land:#101828;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3); --soft:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.1}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.glass{background:var(--paper);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--shadow)}

.app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;z-index:0;background:var(--land);font-family:var(--body)}
.fond-doux{filter:sepia(.22) saturate(.8) contrast(.94) brightness(1.02)}
.leaflet-control-attribution{font-size:10px;max-width:72vw;border-radius:8px 0 0 0;background:var(--paper)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:inherit!important}
.leaflet-bottom{bottom:88px}

/* Barre du haut */
.top{position:absolute;z-index:4;left:0;right:0;top:0;padding:12px 0 0;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.top > *{pointer-events:auto}
.bar{margin:0 14px;height:54px;border-radius:27px;display:flex;align-items:center;gap:10px;padding:0 8px 0 18px}
.bar > svg.i{font-size:19px;color:var(--muted)}
.search{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:16px;font-weight:500}
.search::placeholder{color:var(--muted);font-weight:400}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--solid);display:grid;place-items:center;font-size:18px}
.filters{display:flex;gap:8px;padding:2px 14px 8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px 0 11px;border-radius:19px;border:0;background:var(--paper);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--soft);display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;white-space:nowrap}
.chip svg.i{font-size:16px;color:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);color:#fff}
.chip[aria-pressed="true"] svg.i{color:#fff}
select.chip{appearance:none;-webkit-appearance:none;padding:0 30px 0 14px;background-color:var(--ink);color:var(--solid);background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat}

/* Couches */
.layers{position:absolute;z-index:7;right:14px;top:74px;width:min(310px,calc(100% - 28px));max-height:calc(100% - 180px);overflow-y:auto;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.layers[hidden]{display:none}
.layers h3{font-size:17px;margin-top:4px}
.layers label{display:flex;gap:11px;align-items:flex-start;line-height:1.3}
.layers input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--ink)}
.sw{flex:none;width:20px;height:0;margin-top:8px;border-top:4px solid var(--c);border-radius:2px}
.note{font-size:12.5px;color:var(--muted);margin:0;line-height:1.4}
.zoom{position:absolute;z-index:2;right:16px;bottom:28px;display:none;flex-direction:column;border-radius:16px;overflow:hidden}
.zoom button{width:44px;height:42px;border:0;background:transparent;font-size:22px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}

/* Panneau : lieux et carnet */
.panel{position:absolute;z-index:3;inset:0;background:var(--bg);overflow-y:auto;padding:136px 16px 110px;display:none}
.app[data-view="lieux"] .panel,.app[data-view="carnet"] .panel{display:block}
.panel h2{font-size:32px;font-weight:700}
.panel .sub{color:var(--muted);margin:4px 0 18px}
.panel h3{font-size:20px;margin:26px 0 10px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px 12px 12px;border-radius:18px;border:0;background:var(--solid);box-shadow:0 1px 0 var(--line)}
.pin{width:44px;height:44px;border-radius:14px;background:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--solid));color:var(--c);display:grid;place-items:center;font-size:21px}
.row b{display:block;font-weight:600;line-height:1.25}
.row .c{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.badges{display:flex;gap:4px;flex-direction:column;align-items:flex-end}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap;background:var(--bg)}
.badge.fait{background:var(--ink);color:var(--solid)}
.badge.todo{box-shadow:inset 0 0 0 1.5px var(--ink);background:transparent}
.badge.fav{background:var(--accent);color:var(--accent-ink)}
.empty{padding:20px;border-radius:18px;background:var(--solid);color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-bottom:20px}
.stat{background:var(--solid);border-radius:20px;padding:16px}
.stat:first-child{background:var(--ink);color:var(--solid)}
.stat b{display:block;font-family:var(--display);font-size:40px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.stat span{font-size:13px;opacity:.75}
.bars{display:grid;gap:10px;margin:0;padding:18px;background:var(--solid);border-radius:20px}
.bar-r{display:grid;grid-template-columns:104px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.bar-r i{display:block;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar-r i u{display:block;height:100%;background:var(--c);border-radius:4px}
.bar-r em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.sync{font-size:13px;color:var(--muted);margin:26px 0 0}

/* Fiche */
.sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:74%;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 20px 28px}
.sheet[hidden]{display:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:20px;line-height:1}
.sheet h2{font-size:28px;font-weight:700;padding-right:44px}
.sheet .where{color:var(--muted);margin:4px 0 12px;font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--c);background:var(--bg);background:color-mix(in srgb,var(--c) 13%,var(--solid));padding:5px 11px 5px 8px;border-radius:14px}
.tag svg.i{font-size:14px}
.sheet p{margin:0 0 12px;max-width:62ch}
.go{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:14px 16px;border-radius:18px;background:var(--bg);margin:0 0 16px;font-size:15px}
.go dt{font-weight:600}
.go dd{margin:0}
.mine[hidden]{display:none}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tog{height:46px;border-radius:23px;border:0;background:var(--bg);font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--solid)}
.tog.fav[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.visit{display:grid;gap:10px;margin-top:14px}
.visit[hidden]{display:none}
.visit label{font-size:13.5px;font-weight:600;display:grid;gap:5px}
.visit input,.visit textarea{border:0;border-radius:14px;background:var(--bg);padding:11px 13px;width:100%;font-weight:400;font-size:16px}
.visit textarea{min-height:72px;resize:vertical}
.osm{display:inline-block;margin-top:16px;font-size:13.5px;color:var(--muted)}

/* Navigation */
.nav{position:absolute;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:32px}
.nav button{height:48px;padding:0 18px;border:0;border-radius:24px;background:transparent;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.nav button svg.i{font-size:18px}
.nav button[aria-current="page"]{background:var(--ink);color:var(--solid)}

/* Repères sur la carte */
.mk{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:17px;border:3px solid #fff;box-shadow:0 3px 8px rgba(23,42,74,.4);position:relative;transition:transform .15s}
.mk.todo{outline:2px dashed #172A4A;outline-offset:2px}
.mk.fait{background:#172A4A}
.mk.on{transform:scale(1.3);z-index:2}
.mk.fav::after{content:"";position:absolute;right:-5px;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.leaflet-tooltip{font-family:var(--body);font-weight:600;border:0;border-radius:10px;box-shadow:var(--soft);color:#172A4A}

@media (min-width:900px){
  .top{right:80px;padding-top:16px}
  .bar{margin:0 0 0 16px;width:408px}
  .filters{padding-left:16px}
  .panel{display:block;inset:auto auto 16px 16px;top:134px;width:408px;border-radius:26px;padding:24px 18px 96px;box-shadow:var(--shadow)}
  .nav{left:16px;width:408px;transform:none;bottom:28px;justify-content:center;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav button[data-v="carte"]{display:none}
  .nav button{background:var(--solid);box-shadow:var(--soft)}
  .sheet{left:auto;right:16px;bottom:16px;width:420px;border-radius:28px;max-height:calc(100% - 32px)}
  .sheet .grab{visibility:hidden;margin-bottom:6px}
  .layers{left:448px;right:auto;top:16px;max-height:calc(100% - 32px)}
  .zoom{display:flex;right:16px;top:16px;bottom:auto}
  .leaflet-bottom{bottom:0}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:reduce){ .mk{transition:none} }
</style>
</head>
<body>
<div class="app" id="app" data-view="carte">
  <div id="map" aria-label="Carte du Grand Paris"></div>
  <header class="top">
    <div class="bar glass">
      <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input class="search" id="q" type="search" placeholder="Explorer le Grand Paris" aria-label="Chercher un lieu ou une commune">
      <button class="round" id="b-layers" aria-expanded="false" aria-controls="layers" aria-label="Choisir les couches de la carte"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6 3-6 3-6-3zM2 8l6 3 6-3M2 11l6 3 6-3"/></svg></button>
    </div>
    <div class="filters" id="filters">
      <select class="chip" id="f-statut" aria-label="Filtrer selon mon carnet">
        <option value="">Tous les lieux</option>
        <option value="fav">Mes favoris</option>
        <option value="todo">À faire</option>
        <option value="fait">Déjà faits</option>
        <option value="none">Pas encore classés</option>
      </select>
    </div>
  </header>
  <div class="layers glass" id="layers" hidden>
    <h3>Fond de carte</h3>
    <label><input type="radio" name="fond" id="l-aqua" value="aqua">Aquarelle</label>
    <label><input type="radio" name="fond" id="l-plan" value="plan">Plan épuré</label>
    <label><input type="radio" name="fond" id="l-tc" value="tc">Transports en commun</label>
    <label><input type="radio" name="fond" id="l-cycl" value="velo">Vélo, pistes et aménagements</label>
    <h3>Transports</h3>
    <label><input type="checkbox" id="l-lignes"><span>Lignes de métro, RER, tram et train<br><span class="note" id="l-etat">Tracés officiels d'Île-de-France Mobilités.</span></span></label>
    <h3>Données ouvertes</h3>
    <label><input type="checkbox" id="s-mh"><span>Monuments historiques<br><span class="note" id="e-mh"></span></span></label>
    <label><input type="checkbox" id="s-musees"><span>Musées de France<br><span class="note" id="e-musees"></span></span></label>
    <label><input type="checkbox" id="s-agenda"><span>Agenda des 14 prochains jours<br><span class="note" id="e-agenda"></span></span></label>
    <label><input type="checkbox" id="s-velib"><span>Stations Vélib'<br><span class="note" id="e-velib"></span></span></label>
    <label><input type="checkbox" id="s-vues"><span>Points de vue<br><span class="note" id="e-vues"></span></span></label>
    <label><input type="checkbox" id="s-art"><span>Œuvres d'art dans la rue<br><span class="note" id="e-art"></span></span></label>
    <p class="note">Sources : ministère de la Culture, Ville de Paris, Vélib' Métropole, OpenStreetMap. Touche un point pour ouvrir sa fiche.</p>
  </div>
  <div class="zoom glass"><button id="z-in" aria-label="Zoomer">+</button><button id="z-out" aria-label="Dézoomer">−</button></div>
  <section class="panel" id="panel" aria-live="polite"></section>
  <aside class="sheet glass" id="sheet" hidden></aside>
  <nav class="nav glass" aria-label="Vues">
    <button data-v="carte" aria-current="page"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 4l5-2 4 2 5-2v10l-5 2-4-2-5 2zM6 2v10M10 4v10"/></svg>Carte</button>
    <button data-v="lieux"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4h9M5 8h9M5 12h9M2 4h.01M2 8h.01M2 12h.01"/></svg>Lieux</button>
    <button data-v="carnet"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8v12l-4-3-4 3z"/></svg>Carnet</button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ---------- Données ---------- */
const THEMES = [
  {id:"urb", nom:"Urbanisme",   l:"U"},
  {id:"arc", nom:"Architecture",l:"A"},
  {id:"pat", nom:"Patrimoine",  l:"P"},
  {id:"cul", nom:"Culture",     l:"C"},
  {id:"nat", nom:"Nature",      l:"N"},
  {id:"cur", nom:"Curiosités",  l:"?"},
  {id:"bie", nom:"Bien-être",   l:"B"},
  {id:"loi", nom:"Loisirs",     l:"L"}
];
const TH = Object.fromEntries(THEMES.map(t => [t.id, t]));
const ICO = {
  urb:'<path d="M2 14V6l4-2v10M8 14V2l6 3v9M1 14h14"/>',
  arc:'<path d="M2 14h12M3 14V8a5 5 0 0110 0v6M8 3v11"/>',
  pat:'<path d="M2 6l6-4 6 4zM4 6v7M8 6v7M12 6v7M2 14h12"/>',
  cul:'<rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 11l3.5-3.5 3 3 2-2L14 12"/>',
  nat:'<path d="M8 14v-4M8 10a4 4 0 110-8 4 4 0 010 8z"/>',
  cur:'<path d="M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z"/>',
  bie:'<path d="M2 6c2-2 4 2 6 0s4 2 6 0M2 10c2-2 4 2 6 0s4 2 6 0"/>',
  loi:'<circle cx="8" cy="8" r="6"/><path d="M6.5 5.5v5l4-2.5z"/>',
  ok:'<path d="M3 8.5l3.2 3.2L13 5"/>', pt:'<circle cx="8" cy="8" r="2.5"/>',
  star:'<path d="M8 2l1.8 3.9 4.2.5-3.1 2.9.8 4.2L8 11.4l-3.7 2.1.8-4.2L2 6.4l4.2-.5z"/>',
  todo:'<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.3 1.6"/>'
};
const ico = k => '<svg class="i" viewBox="0 0 16 16" aria-hidden="true">' + (ICO[k] || ICO.pt) + '</svg>';

const LIEUX = [
 {id:"cite-jardin-suresnes", n:"Cité-jardin de Suresnes", c:"Suresnes", p:[48.8665,2.2075], t:["urb","arc","pat"],
  d:"Un quartier entier pensé dans l'entre-deux-guerres sous le mandat d'Henri Sellier : logements, écoles, théâtre et jardins. On s'y promène comme dans un manuel d'urbanisme social, en plus vivant.",
  a:"Tram T2, Suresnes-Longchamp, puis bus ou vingt minutes de marche", v:"Ça grimpe depuis la Seine : prévoir les vitesses."},
 {id:"butte-rouge", n:"La Butte Rouge", c:"Châtenay-Malabry", p:[48.7680,2.2610], t:["urb","arc","nat"],
  d:"Une cité-jardin des années 1930 posée dans la pente, où les immeubles roses se glissent entre les arbres. Un des ensembles les plus aboutis du genre en France.",
  a:"Tram T10, arrêt Cité-Jardin", v:"La Coulée verte du sud parisien passe à proximité."},
 {id:"basilique-saint-denis", n:"Basilique de Saint-Denis", c:"Saint-Denis", p:[48.9355,2.3599], t:["pat","arc"],
  d:"Le chevet voulu par l'abbé Suger au XIIe siècle est considéré comme l'acte de naissance du gothique. À l'intérieur, les tombeaux des rois et reines de France.",
  a:"Métro 13, Basilique de Saint-Denis", v:"Accès agréable par les berges du canal Saint-Denis."},
 {id:"maison-la-roche", n:"Maison La Roche", c:"Paris 16e", p:[48.8519,2.2654], t:["arc","cul"],
  d:"Une villa blanche de Le Corbusier et Pierre Jeanneret, construite entre 1923 et 1925 au fond d'une impasse. La promenade architecturale y prend tout son sens.",
  a:"Métro 9, Jasmin"},
 {id:"espaces-abraxas", n:"Les Espaces d'Abraxas", c:"Noisy-le-Grand", p:[48.8400,2.5400], t:["arc","urb","cur"],
  d:"Le palais monumental de Ricardo Bofill, entre théâtre antique et décor de science-fiction. Plusieurs films y ont été tournés. On regarde depuis l'espace public, des gens y vivent.",
  a:"RER A, Noisy-le-Grand Mont d'Est"},
 {id:"tours-aillaud", n:"Les Tours Nuages", c:"Nanterre", p:[48.8890,2.2180], t:["arc","urb","cur"],
  d:"Dix-huit tours aux formes ondulantes dessinées par Émile Aillaud dans les années 1970, avec leurs fenêtres en goutte d'eau et leurs façades en mosaïque de ciel.",
  a:"RER A, Nanterre-Préfecture"},
 {id:"etoiles-ivry", n:"Les Étoiles d'Ivry", c:"Ivry-sur-Seine", p:[48.8130,2.3860], t:["arc","urb"],

/* ---------- Carnet : état et stockage ---------- */
const LS_CARNET = "gp-carnet-v1", LS_PREFS = "gp-prefs-v5";
let carnet = {};
let prefs = {fond:"aqua", lignes:true, src:{musees:true, agenda:true}};
try { carnet = JSON.parse(localStorage.getItem(LS_CARNET) || "{}") || {}; } catch (e) {}
try { Object.assign(prefs, JSON.parse(localStorage.getItem(LS_PREFS) || "{}")); } catch (e) {}
if (!prefs.src || typeof prefs.src !== "object") prefs.src = {};
let dirty = false, timer = null, syncState = "local";

function entry(id){ return carnet[id] || {}; }
function setEntry(id, patch){
  const e = Object.assign({}, carnet[id] || {}, patch);
  if (!e.fav) delete e.fav;
  if (!e.st) { delete e.st; delete e.date; }
  if (e.st !== "fait") delete e.date;
  if (!e.note) delete e.note;
  if (e.fav || e.st || e.note) carnet[id] = e; else delete carnet[id];
  try { localStorage.setItem(LS_CARNET, JSON.stringify(carnet)); } catch (err) {}
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(flush, 700);
}
function flush(){}
function initSync(){}
function paintSync(){
  const el = document.getElementById("sync");
  if (el) el.textContent = syncState === "ok"
    ? "Carnet enregistré dans ton compte, disponible sur tous tes appareils."
    : "Carnet enregistré sur cet appareil.";
}

/* ---------- Filtres ---------- */
const sel = {themes:new Set(), statut:"", q:""};
let current = null, view = "carte";
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function matches(l){
  if (sel.themes.size && !l.t.some(t => sel.themes.has(t))) return false;
  const e = entry(l.id);
  if (sel.statut === "fav" && !e.fav) return false;
  if (sel.statut === "todo" && e.st !== "todo") return false;
  if (sel.statut === "fait" && e.st !== "fait") return false;
  if (sel.statut === "none" && (e.fav || e.st)) return false;
  if (sel.q) { const q = norm(sel.q); if (!norm(l.n + " " + l.c).includes(q)) return false; }
  return true;
}
const LIEUX_ID = Object.fromEntries(LIEUX.map(l => [l.id, l])), extCache = {};
function tous(){
  return LIEUX.concat(Object.keys(carnet).filter(id => carnet[id].x && !LIEUX_ID[id]).map(id => extCache[id] || (extCache[id] = Object.assign({id, ext: true, t: []}, carnet[id].x))));
}
const snap = l => ({n: l.n, c: l.c || "", p: l.p, t: l.t || [], d: l.d || "", plus: l.plus || "", url: l.url || "", src: l.src || "", credit: l.credit || ""});
const save = (l, patch) => setEntry(l.id, l.ext ? Object.assign({x: snap(l)}, patch) : patch);
const visibles = () => tous().filter(matches);

/* ---------- Carte (Leaflet + OpenStreetMap) ---------- */
const OSM = '&copy; contributeurs <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
const map = L.map("map", {zoomControl:false, minZoom:10, maxBounds:[[48.50,1.90],[49.15,2.85]]}).setView([48.862, 2.36], window.innerWidth < 900 ? 11 : 12);
const fonds = {
  plan: L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {subdomains:"abcd", maxZoom:20, className:"fond-doux", attribution:OSM + ' · &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'}),
  aqua: L.tileLayer("https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg", {maxNativeZoom:16, maxZoom:19, attribution:'&copy; <a href="https://stadiamaps.com/" target="_blank" rel="noopener">Stadia Maps</a> &copy; <a href="https://stamen.com/" target="_blank" rel="noopener">Stamen Design</a> · ' + OSM}),

  velo: L.tileLayer("https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png", {maxZoom:19, attribution:'<a href="https://www.cyclosm.org" target="_blank" rel="noopener">CyclOSM</a> · ' + OSM})
};
const gLieux = L.layerGroup().addTo(map);
/* Tracés officiels des lignes (données ouvertes Île-de-France Mobilités), chargés à la demande */
const IDFM = "https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets/traces-du-reseau-ferre-idf/exports/geojson";
const COUL = {"METRO 1":"#FFCD00","METRO 2":"#003CA6","METRO 3":"#837902","METRO 4":"#BB4D98","METRO 5":"#FF7E2E","METRO 6":"#6ECA97","METRO 7":"#FA9ABA","METRO 8":"#E19BDF","METRO 9":"#B6BD00","METRO 10":"#C9910D","METRO 11":"#704B1C","METRO 12":"#007852","METRO 13":"#6EC4E8","METRO 14":"#62259D","RER A":"#E2231A","RER B":"#5291CE","RER C":"#FFCE00","RER D":"#00814F","RER E":"#C04191"};
const gLignes = L.layerGroup(); let lignesState = "idle";
function couleur(p){
  for (const k in p) { const v = String(p[k] == null ? "" : p[k]).trim(); if (/colou?r/i.test(k) && /^#?[0-9a-f]{6}$/i.test(v)) return "#" + v.replace("#", ""); }
  const n = String(p.res_com || p.reseau || "").toUpperCase().replace(/\s+/g, " ").trim();
  if (COUL[n]) return COUL[n];
  const m = String(p.mode || "").toUpperCase() + " " + n;
  return m.includes("TRAM") ? "#4E7A8C" : m.includes("METRO") ? "#3E5C9A" : m.includes("RER") ? "#B0413E" : "#7A6A8C";
}
function paintLignes(){
  const el = document.getElementById("l-etat"); if (!el) return;
  el.textContent = lignesState === "loading" ? "Chargement des lignes, quelques secondes…"
    : lignesState === "err" ? "Les tracés officiels ne répondent pas pour le moment. Décoche puis recoche pour réessayer, ou utilise le fond Transports en commun."
    : "Tracés officiels d'Île-de-France Mobilités, affichables sur n'importe quel fond.";
}
async function loadLignes(){
  if (lignesState === "loading" || lignesState === "ok") return;
  lignesState = "loading"; paintLignes();
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
    const r = await fetch(IDFM, {signal: ctl.signal}); clearTimeout(to);
    if (!r.ok) throw new Error("http " + r.status);
    const gj = await r.json();
    L.geoJSON(gj, {
      renderer: L.canvas({padding: 0.3}),
      attribution: "Tracés des lignes : Île-de-France Mobilités",
      filter: f => !!(f.geometry && /LineString/.test(f.geometry.type)),
      style: f => { const p = f.properties || {}, m = String(p.mode || p.res_com || "").toUpperCase(); return {color: couleur(p), weight: /TRAIN/.test(m) ? 2.5 : 3.5, opacity: 0.9}; },
      onEachFeature: (f, lay) => { const p = f.properties || {}, n = p.res_com || p.reseau || p.indice_lig; if (n) lay.bindTooltip(String(n), {sticky: true}); }
    }).addTo(gLignes);
    lignesState = "ok";
  } catch (e) { lignesState = "err"; }
  paintLignes();
}
function applyLayers(){
  if (prefs.lignes) { gLignes.addTo(map); loadLignes(); } else map.removeLayer(gLignes);
  const f = fonds[prefs.fond] ? prefs.fond : "aqua";
  Object.keys(fonds).forEach(k => { if (k === f) fonds[k].addTo(map); else map.removeLayer(fonds[k]); });
}
/* ---------- Sources ouvertes, chargées à la demande ---------- */
const CENTRE = [48.86, 2.36], BBOX = [48.66, 2.12, 49.02, 2.62];
const THEX = {urb:"#5568C2",arc:"#8757B4",pat:"#8C6646",cul:"#C13C76",nat:"#34844D",cur:"#B07C0C",bie:"#1F8C9F",loi:"#D2552B"};
const canvasR = L.canvas({padding: 0.3});
const dansZone = p => !!p && p[0] > BBOX[0] && p[0] < BBOX[2] && p[1] > BBOX[1] && p[1] < BBOX[3];
function pt(v){
  if (!v) return null;
  if (Array.isArray(v)) return [+v[0], +v[1]];
  if (typeof v === "object") return v.lat != null && v.lon != null ? [+v.lat, +v.lon] : null;
  if (typeof v === "string") { const m = v.split(",").map(Number); return m.length === 2 && !m.some(isNaN) ? m : null; }
  return null;
}
const txt = (s, max) => { let t = String(s == null ? "" : s).replace(/<[^>]*>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ").trim(); if (max && t.length > max) t = t.slice(0, max).replace(/\s+\S*$/, "") + "…"; return t; };
const jour = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || "")); return m ? m[3] + "/" + m[2] + "/" + m[1] : ""; };
async function getJSON(url, opt, ms){
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms || 30000);
  try { const r = await fetch(url, Object.assign({signal: ctl.signal}, opt || {})); if (!r.ok) throw new Error("http " + r.status); return await r.json(); }
  finally { clearTimeout(to); }
}
/* Portails Opendatasoft : on lit d'abord le schéma du jeu de données pour trouver les bons champs */
async function odsLoad(cfg){
  let last = new Error("aucun serveur");
  for (const host of cfg.hosts) {
    try {
      const base = host + "/api/explore/v2.1/catalog/datasets/" + cfg.ds;
      const names = Object.assign({}, cfg.guess);
      try {
        const fields = (await getJSON(base)).fields || [];
        const geo = fields.find(f => f.type === "geo_point_2d"); if (geo) names.geo = geo.name;
        for (const k in cfg.hints) {
          let hit = null;
          for (const re of cfg.hints[k]) { const f = fields.find(x => re.test(x.name)); if (f) { hit = f.name; break; } }
          if (hit) names[k] = hit; else if (fields.length && !fields.some(f => f.name === names[k])) delete names[k];
        }
      } catch (e) { /* schéma illisible : on tente avec les noms habituels */ }
      const select = [...new Set(Object.values(names))].join(",");
      const extra = cfg.where ? cfg.where(names) : "";
      const zones = cfg.partout ? [""] : [
        "within_distance(" + names.geo + ", geom'POINT(" + CENTRE[1] + " " + CENTRE[0] + ")', 22km)",
        "in_bbox(" + names.geo + ", " + BBOX.join(", ") + ")"];
      let rows = null;
      for (const z of zones) {
        const where = [z, extra].filter(Boolean).join(" and ");
